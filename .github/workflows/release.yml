# Pushing a version tag, such as v0.2.0 or v0.2.0-beta.1, builds, signs and
# notarizes Tiller, publishes the release and adds it to the appcast. The tag
# must match Cargo.toml's version. docs/releasing.md lists the secrets.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number counts every commit.
          fetch-depth: 0

      - name: Check CHANGELOG.md has the release's notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) ;; # A beta shows "## Unreleased", which may be empty.
            *) grep -qxF "## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## $version section"; exit 1; } ;;
          esac

      - run: |
          rustup toolchain install stable --profile minimal
          brew install ninja zstd

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/cef
            ~/.local/share/cef-codecs
          key: cef-${{ hashFiles('scripts/fetch-cef.sh') }}

      - run: scripts/fetch-cef.sh

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate that issues Developer ID certificates, in case the runner lacks it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
